[package]
name = "restui"
version = "0.1.0"
edition = "2024"
description = "A lightweight terminal workspace for testing HTTP APIs"
license = "MIT"
keywords = ["api", "http", "tui", "client"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
arboard = "3.6"
crossterm = "0.28"
directories = "6.0"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23"
